# Static server of the shell. Rules (Annex H, norm 5.5): the SPA falls back to index.html so
# every route of the router works on reload; index.html and remoteEntry.js are never cached,
# because they decide which version of each portal the browser loads; hashed assets cache for
# a year. The gateway is reached by the browser directly at VITE_GATEWAY_URL; nothing is proxied here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"qone-front"}';
    }

    # The federation entry and the document: always revalidate (Annex H rule 4).
    location ~* ^/(remoteEntry\.js|index\.html|mockServiceWorker\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Hashed build output: immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Everything else is a router route: serve the document without caching it.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri /index.html;
    }
}
